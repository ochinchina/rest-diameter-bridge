name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 
permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Upload (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 64-bit
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false

          # Linux 32-bit
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

          # Windows 64-bit
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

          # Windows 32-bit
          - target: i686-pc-windows-msvc
            os: windows-latest
            use_cross: false

          # macOS Apple Silicon (x86_64-apple-darwin can be added if needed)
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

          # macOS Intel (x86_64 / AMD64)
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false

          # FreeBSD 64-bit (x86_64 / AMD64)
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            use_cross: true            
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (32-bit Linux)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package artifacts
        shell: bash
        run: |
          PROJECT_NAME="rest-diameter-bridge"
          STAGE="staging"
          mkdir -p "$STAGE"

          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="${PROJECT_NAME}.exe"
            ASSET_NAME="${PROJECT_NAME}-${{ github.ref_name }}-${{ matrix.target }}.zip"
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGE/"
            cd "$STAGE"
            7z a "../${ASSET_NAME}" "${BIN_NAME}"
          else
            BIN_NAME="${PROJECT_NAME}"
            ASSET_NAME="${PROJECT_NAME}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGE/"
            cd "$STAGE"
            tar czf "../${ASSET_NAME}" "${BIN_NAME}"
          fi

          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_ENV

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  
    Commit the workflow file to your default branch. Whenever you want to create a release, tag your commit and push it to GitHub:
